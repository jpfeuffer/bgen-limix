[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=3.0", "numpy>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "bgen-limix"
version = "4.10.1"
description = "Python wrapper around the BGEN C library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Danilo Horta", email = "danilo.horta@pm.me" },
    { name = "Julianus Pfeuffer" },
]
keywords = ["bgen", "reader", "genetics", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.0",
    "pooch>=1.6",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/jpfeuffer/bgen-limix"
Repository = "https://github.com/jpfeuffer/bgen-limix"
Issues = "https://github.com/jpfeuffer/bgen-limix/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

# See scripts/dynamic_metadata.py: only adds the nanobind-backend dependency
# when NOT building with BGEN_NANOBIND_BACKEND=private (self-contained backend).
[[tool.dynamic-metadata]]
provider = { path = "scripts", module = "dynamic_metadata" }

[tool.scikit-build]
cmake.build-type = "Release"
cmake.source-dir = "python"
build-dir = "build-python"
wheel.py-api = "cp311"
wheel.packages = ["python/cbgen"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "--import-mode=importlib"
