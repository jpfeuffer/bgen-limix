[workspace]
name = "bgen"
version = "4.2.1"
description = "C library and Python bindings for the BGEN format (specifications 1.2 and 1.3)"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
license = "MIT"
# pixi-build is required for the [package] section below.
preview = ["pixi-build"]

# ---------------------------------------------------------------------------
# bgen C library as a first-class pixi package.
# pixi-build-cmake selects the correct platform toolchain (MSVC on Windows,
# clang on macOS, gcc on Linux) so downstream consumers always see a
# compatible ABI – no manual install-c step or compiler mismatch hacks needed.
# ---------------------------------------------------------------------------
[package]
name = "bgen"
version = "4.2.1"

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.build.config]
compilers = ["c", "cxx"]
extra-args = [
  "-DBGEN_BUILD_TESTS=OFF",
  "-DBGEN_USE_SYSTEM_ZLIB_NG=ON",
  "-DBGEN_USE_SYSTEM_ZSTD=ON",
  "-DBGEN_USE_SYSTEM_ATHR=ON",
  "-DBGEN_USE_SYSTEM_CURL=ON",
  "-DBGEN_ENABLE_S3=ON",
]

[package.host-dependencies]
zstd = "*"
zlib-ng = "*"
almosthere = "*"
libcurl = "*"

[package.run-dependencies]
# bgen is built as a shared library (pixi-build-cmake default); these shared
# libraries must be present at runtime wherever bgen is used.
zstd = "*"
zlib-ng = "*"
almosthere = "*"
libcurl = "*"

# ---------------------------------------------------------------------------
# Workspace-level dependencies (available in every environment).
# bgen = { path = "." } triggers pixi-build-cmake so that `pixi install`
# builds and installs the C library with the correct platform toolchain
# before any Python build step runs.
# ---------------------------------------------------------------------------
[dependencies]
bgen = { path = "." }
cmake = "*"
ninja = "*"
zstd = "*"
zlib-ng = "*"
almosthere = "*"
libcurl = "*"

[feature.python.dependencies]
python = "*"
numpy = "*"
nanobind = "*"
scikit-build-core = "*"
pip = "*"

[feature.test.dependencies]
pytest = "*"
pooch = "*"

[feature.dev.dependencies]
pre-commit = "*"
ruff = "*"

[environments]
default = { features = ["python", "test", "dev"], solve-group = "default" }
build = { features = ["python"], solve-group = "default" }
test = { features = ["python", "test"], solve-group = "default" }

[tasks]
# Manual cmake workflow – useful for C development and running C tests locally.
configure = "cmake --preset pixi -DCMAKE_BUILD_TYPE=Release"
build-c = { cmd = "cmake --build build", depends-on = ["configure"] }
test-c = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build-c"] }
# pixi install (triggered automatically by pixi run) builds and installs bgen
# via pixi-build-cmake, so pip can find a compatible pre-built library.
build-python = "pip install --no-build-isolation -e ."
test-python = { cmd = "pytest python/tests", depends-on = ["build-python"] }
test = { depends-on = ["test-c", "test-python"] }
