[workspace]
name = "bgen"
version = "4.2.1"
description = "C library and Python bindings for the BGEN format (specifications 1.2 and 1.3)"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
license = "MIT"

[dependencies]
cmake = "*"
ninja = "*"
zstd = "*"
zlib-ng = "*"
almosthere = "*"
libcurl = "*"

[feature.python.dependencies]
python = "*"
numpy = "*"
nanobind = "*"
scikit-build-core = "*"
pip = "*"

[feature.test.dependencies]
pytest = "*"
pooch = "*"

[feature.dev.dependencies]
pre-commit = "*"
ruff = "*"

[environments]
default = { features = ["python", "test", "dev"], solve-group = "default" }
build = { features = ["python"], solve-group = "default" }
test = { features = ["python", "test"], solve-group = "default" }

[tasks]
configure = "cmake --preset pixi -DCMAKE_BUILD_TYPE=Release"
build-c = { cmd = "cmake --build build", depends-on = ["configure"] }
test-c = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build-c"] }
# Install the C library into the environment so the Python build reuses it
# (find_package(bgen) discovers $CONDA_PREFIX/lib/cmake/bgen) instead of
# rebuilding the C sources from scratch.
install-c = { cmd = "cmake --install build --prefix $CONDA_PREFIX", depends-on = ["build-c"] }
build-python = { cmd = "pip install --no-build-isolation -e .", depends-on = ["install-c"] }
test-python = { cmd = "pytest python/tests", depends-on = ["build-python"] }
test = { depends-on = ["test-c", "test-python"] }
