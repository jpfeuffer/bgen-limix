name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-c:
    name: "C library (${{ matrix.os }}, ${{ matrix.build_type }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        build_type: [Release, Debug]
        include:
          - os: ubuntu-24.04
            sanitizers: ON
          - os: macos-15
            sanitizers: OFF
          - os: windows-2025
            sanitizers: OFF

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: prefix-dev/setup-pixi@v0.9.6

      - name: Configure CMake
        run: >
          pixi run cmake --preset pixi
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBGEN_BUILD_TESTS=ON
          -DBGEN_BUILD_PYTHON=OFF
          -DBGEN_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: pixi run cmake --build build --config ${{ matrix.build_type }}

      - name: Test (Linux / macOS)
        if: runner.os != 'Windows'
        run: pixi run ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # pixi run resets PATH; prepend Library\bin for the conda DLLs
          # (zlib-ng, zstd, libcurl …).  libstdc++ / libgcc are now statically
          # linked via the MINGW target_link_options in CMakeLists.txt, so
          # there is no MinGW DLL version conflict any more.
          $pixi_bin = "${{ github.workspace }}\.pixi\envs\default\Library\bin"
          $env:PATH = "$pixi_bin;C:\mingw64\bin;$env:PATH"
          & "$pixi_bin\ctest.exe" --test-dir "${{ github.workspace }}\build" `
            -C ${{ matrix.build_type }} --output-on-failure
  test-python:
    name: "Python (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: test

      - name: Build and test Python
        run: pixi run -e test test-python

  test-s3:
    name: "S3 integration (MinIO)"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: test

      - name: Start MinIO server
        run: |
          docker run -d --name minio-ci \
            -p 19000:9000 \
            -e MINIO_ROOT_USER=minio_access \
            -e MINIO_ROOT_PASSWORD=minio_secret \
            quay.io/minio/minio:latest server /data
          # Wait for MinIO
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:19000/minio/health/live && break
            sleep 1
          done

      - name: Upload test data to MinIO
        env:
          AWS_ACCESS_KEY_ID: minio_access
          AWS_SECRET_ACCESS_KEY: minio_secret
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:19000
        run: |
          pip install awscli --quiet
          aws s3 mb s3://bgen-test --endpoint-url "$AWS_ENDPOINT_URL"
          aws s3 cp test/data/example.14bits.bgen s3://bgen-test/example.14bits.bgen \
            --endpoint-url "$AWS_ENDPOINT_URL"
          # Public bucket for no-sign test
          aws s3 mb s3://bgen-public --endpoint-url "$AWS_ENDPOINT_URL"
          aws s3api put-bucket-policy --bucket bgen-public \
            --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::bgen-public/*"}]}' \
            --endpoint-url "$AWS_ENDPOINT_URL"
          aws s3 cp test/data/example.14bits.bgen s3://bgen-public/example.14bits.bgen \
            --endpoint-url "$AWS_ENDPOINT_URL"

      - name: Configure & build (S3 enabled)
        run: |
          pixi run cmake --preset pixi \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBGEN_BUILD_TESTS=ON \
            -DBGEN_ENABLE_S3=ON
          pixi run cmake --build build

      - name: Run C S3 tests
        env:
          AWS_ACCESS_KEY_ID: minio_access
          AWS_SECRET_ACCESS_KEY: minio_secret
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:19000
          BGEN_TEST_S3_URI: s3://bgen-test/example.14bits.bgen
          BGEN_TEST_S3_METAFILE: ${{ github.workspace }}/test/data/example.14bits.bgen.metafile
        run: pixi run ./build/test/test_s3_open

      - name: Run C S3 test (no-sign / public bucket)
        env:
          AWS_NO_SIGN_REQUEST: "1"
          AWS_ENDPOINT_URL: http://127.0.0.1:19000
          BGEN_TEST_S3_URI: s3://bgen-public/example.14bits.bgen
          BGEN_TEST_S3_METAFILE: ${{ github.workspace }}/test/data/example.14bits.bgen.metafile
        run: pixi run ./build/test/test_s3_open

      - name: Install Python package with S3
        run: |
          pixi run -e test pip install --quiet "universal_pathlib>=0.2" "s3fs>=2024.1"
          CMAKE_ARGS="-DBGEN_ENABLE_S3=ON" pixi run -e test pip install --no-build-isolation -e .

      - name: Run Python S3/UPath tests
        env:
          BGEN_TEST_MINIO_ENDPOINT: http://127.0.0.1:19000
          BGEN_TEST_MINIO_ACCESS: minio_access
          BGEN_TEST_MINIO_SECRET: minio_secret
          BGEN_TEST_S3_METAFILE: ${{ github.workspace }}/test/data/example.14bits.bgen.metafile
        run: pixi run -e test pytest python/tests/test_s3_upath.py -v

  test-s3-windows:
    # Separate from test-s3: GitHub's Windows runners only run Windows
    # containers by default, so MinIO runs here as a native .exe instead of
    # via Docker. This job exists specifically to cover bgen_file's lazy,
    # Range-request-based reads on Windows (stream_handle), which used to
    # be masked by an eager full-object download before any read happened.
    name: "S3 integration (MinIO, Windows)"
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: test

      - name: Start MinIO, build, and run the C S3 test
        # GitHub's Windows runners tear down each step's process tree
        # (job-object kill-on-close) when the step ends, so a MinIO server
        # backgrounded in its own step is gone before the next step runs.
        # Everything that needs MinIO alive has to be one step.
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: minio_access
          AWS_SECRET_ACCESS_KEY: minio_secret
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:19000
          BGEN_TEST_S3_URI: s3://bgen-test/example.14bits.bgen
          BGEN_TEST_S3_METAFILE: ${{ github.workspace }}\test\data\example.14bits.bgen.metafile
        run: |
          # dl.min.io no longer serves binary releases (410 Gone; MinIO
          # archived that distribution channel), so install from conda-forge
          # via pixi instead of downloading minio.exe directly.
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\miniodata" | Out-Null
          $env:MINIO_ROOT_USER = "minio_access"
          $env:MINIO_ROOT_PASSWORD = "minio_secret"

          # Resolve+cache the package before backgrounding the server, so a
          # cold conda-forge solve/download doesn't eat into the health-check
          # timeout below.
          $pixiExe = (Get-Command pixi).Source
          & $pixiExe exec --spec minio-server -- minio --version

          Start-Process -FilePath $pixiExe `
            -ArgumentList "exec", "--spec", "minio-server", "--", "minio", "server", "$env:RUNNER_TEMP\miniodata", "--address", ":19000" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\minio.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\minio.err.log"

          $up = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:19000/minio/health/live" | Out-Null
              $up = $true
              break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) {
            Write-Host "--- minio.log ---"; Get-Content "$env:RUNNER_TEMP\minio.log" -ErrorAction SilentlyContinue
            Write-Host "--- minio.err.log ---"; Get-Content "$env:RUNNER_TEMP\minio.err.log" -ErrorAction SilentlyContinue
            throw "MinIO did not become healthy within the timeout"
          }

          pixi run -e test pip install --quiet awscli
          pixi run -e test aws s3 mb s3://bgen-test --endpoint-url $env:AWS_ENDPOINT_URL
          if ($LASTEXITCODE -ne 0) { throw "aws s3 mb failed" }
          pixi run -e test aws s3 cp test/data/example.14bits.bgen s3://bgen-test/example.14bits.bgen --endpoint-url $env:AWS_ENDPOINT_URL
          if ($LASTEXITCODE -ne 0) { throw "aws s3 cp failed" }

          pixi run cmake --preset pixi -DCMAKE_BUILD_TYPE=Debug -DBGEN_BUILD_TESTS=ON -DBGEN_BUILD_PYTHON=OFF -DBGEN_ENABLE_S3=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          pixi run cmake --build build --config Debug
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

          # Same DLL-path fix as the test-c Windows step (zlib-ng, zstd, libcurl).
          # Single-config Ninja generator (see CMakePresets.json), so the
          # binary lands directly in build\test, no per-config subfolder.
          $pixi_bin = "${{ github.workspace }}\.pixi\envs\default\Library\bin"
          $env:PATH = "$pixi_bin;C:\mingw64\bin;$env:PATH"
          & "${{ github.workspace }}\build\test\test_s3_open.exe"
          if ($LASTEXITCODE -ne 0) { throw "test_s3_open failed" }


